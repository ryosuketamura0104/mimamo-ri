name: Mimamori
options:
  bundleIdPrefix: com.crouton.mimamori
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "ABHGTY2RG2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # サーバー API のベース URL。各ターゲットの Info.plist (APIBaseURL) に展開される。
    # 本番配布時は Release 設定で上書きする。
    API_BASE_URL: https://mimamori-server-969422387966.asia-northeast1.run.app
  configs:
    Debug:
      # ローカル開発: Firebase Auth エミュレータ(空なら本番 Firebase を使用)
      # 本番 Firebase を使うため空にする(値を入れるとエミュレータへ向く)
      FIREBASE_AUTH_EMULATOR_HOST: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
# RevenueCat 導入時:
#   RevenueCat:
#     url: https://github.com/RevenueCat/purchases-ios
#     from: 5.0.0

targets:

  MimamoriKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MimamoriKit
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori.MimamoriKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  Mimamori:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      # XcodeGen に resources: というキーは無く、書いても無視される。
      # GoogleService-Info.plist のようなリソースも sources に含める
      - path: Resources
    dependencies:
      - target: MimamoriKit
      - package: Firebase
        product: FirebaseAuth
      - target: WidgetExtension
        embed: true
      - target: LocationPushExtension
        embed: true
      - target: NotificationServiceExtension
        embed: true
      - target: DeviceActivityMonitorExtension
        embed: true
    entitlements:
      path: Sources/App/Mimamori.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crouton.mimamori
        aps-environment: development
        com.apple.developer.usernotifications.communication: YES
        com.apple.developer.family-controls: YES
        com.apple.developer.location.push: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: mimamo-ri
        UILaunchScreen: {}
        # Firebase(GoogleUtilities)の AppDelegate swizzling を無効化する。
        # 有効だと didRegisterForRemoteNotificationsWithDeviceToken が横取りされ、
        # FirebaseMessaging を使っていない構成では自前のデリゲートに渡ってこない。
        # Auth しか使っていないため無効で問題ない。
        FirebaseAppDelegateProxyEnabled: false
        APIBaseURL: $(API_BASE_URL)
        FirebaseAuthEmulatorHost: $(FIREBASE_AUTH_EMULATOR_HOST)
        # Widget からの起動導線用カスタム URL スキーム
        CFBundleURLTypes:
          - CFBundleURLName: com.crouton.mimamori
            CFBundleURLSchemes:
              - mimamori
        # 開発時に http://localhost へ接続するための ATS 例外(ローカルのみ)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
          - location
          - processing
        NSLocationAlwaysAndWhenInUseUsageDescription: 見守り機能のため、位置情報を「常に許可」で使用します
        NSLocationWhenInUseUsageDescription: 見守り機能のため、位置情報を使用します
        NSMotionUsageDescription: 歩数から生存シグナルを取得するために使用します
        NSUserActivityTypes:
          - com.crouton.mimamori.ReportAlive
        BGTaskSchedulerPermittedIdentifiers:
          - com.crouton.mimamori.signal-sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori
        TARGETED_DEVICE_FAMILY: "1,2"

  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WidgetExtension
    dependencies:
      - target: MimamoriKit
    entitlements:
      path: Sources/WidgetExtension/WidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crouton.mimamori
    info:
      path: Sources/WidgetExtension/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori.WidgetExtension

  LocationPushExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LocationPushExtension
    dependencies:
      - target: MimamoriKit
    entitlements:
      path: Sources/LocationPushExtension/LocationPushExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crouton.mimamori
        com.apple.developer.location.push: YES
    info:
      path: Sources/LocationPushExtension/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.location.push.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LocationPushService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori.LocationPushExtension

  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationServiceExtension
    dependencies:
      - target: MimamoriKit
    entitlements:
      path: Sources/NotificationServiceExtension/NotificationServiceExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crouton.mimamori
    info:
      path: Sources/NotificationServiceExtension/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori.NotificationServiceExtension

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/DeviceActivityMonitorExtension
    dependencies:
      - target: MimamoriKit
    entitlements:
      path: Sources/DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crouton.mimamori
        com.apple.developer.family-controls: YES
    info:
      path: Sources/DeviceActivityMonitorExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MimamoriDeviceActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crouton.mimamori.DeviceActivityMonitorExtension
